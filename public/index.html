<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>FinchPay Refund Desk</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #f4f6f8;
				--card: #ffffff;
				--text: #14202b;
				--muted: #64748b;
				--line: #e2e8f0;
				--brand: #0f766e;
				--brand-ink: #ffffff;
				--brand-soft: #e6f4f2;
				--agent: #f1f5f9;
				--good: #15803d;
				--good-soft: #e8f6ec;
				--bad: #b91c1c;
				--bad-soft: #fdecec;
				--warn: #b45309;
				--violet: #6d28d9;
				--blue: #1d4ed8;
				--shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0b1117;
					--card: #121a22;
					--text: #e6edf3;
					--muted: #8b9aab;
					--line: #223040;
					--brand: #2dd4bf;
					--brand-ink: #062a26;
					--brand-soft: #0f2c2a;
					--agent: #1a2430;
					--good: #4ade80;
					--good-soft: #10261a;
					--bad: #f87171;
					--bad-soft: #2a1414;
					--warn: #fbbf24;
					--violet: #a78bfa;
					--blue: #60a5fa;
					--shadow: none;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
			}
			body {
				font:
					15px/1.5 Inter,
					system-ui,
					-apple-system,
					sans-serif;
				background: var(--bg);
				color: var(--text);
			}
			button {
				font: inherit;
				cursor: pointer;
			}

			/* Top bar */
			.top {
				position: sticky;
				top: 0;
				z-index: 5;
				background: color-mix(in srgb, var(--bg) 85%, transparent);
				backdrop-filter: blur(8px);
				border-bottom: 1px solid var(--line);
			}
			.top-inner {
				max-width: 1180px;
				margin: 0 auto;
				padding: 12px 16px;
				display: flex;
				align-items: center;
				gap: 12px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				font-weight: 700;
				font-size: 17px;
				letter-spacing: -0.01em;
			}
			.brand small {
				font-weight: 500;
				color: var(--muted);
				font-size: 14px;
			}
			.top .spacer {
				flex: 1;
			}
			.btn {
				border: 1px solid var(--line);
				background: var(--card);
				color: var(--text);
				padding: 8px 14px;
				border-radius: 999px;
				font-weight: 500;
				font-size: 14px;
			}
			.btn:hover {
				border-color: var(--brand);
			}
			.btn.primary {
				background: var(--brand);
				color: var(--brand-ink);
				border-color: var(--brand);
			}
			.btn.primary:hover {
				filter: brightness(1.05);
			}

			/* Layout */
			.wrap {
				max-width: 1180px;
				margin: 0 auto;
				padding: 20px 16px 32px;
				display: grid;
				grid-template-columns: minmax(0, 1fr) 400px;
				gap: 20px;
				align-items: start;
			}
			@media (max-width: 960px) {
				.wrap {
					grid-template-columns: 1fr;
				}
			}
			.card {
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 16px;
				box-shadow: var(--shadow);
			}

			/* Steps */
			.steps {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 14px 18px;
				border-bottom: 1px solid var(--line);
			}
			.step {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 13px;
				font-weight: 500;
				color: var(--muted);
				white-space: nowrap;
			}
			.step .dot {
				width: 24px;
				height: 24px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				border: 1.5px solid var(--line);
				font-size: 12px;
				font-weight: 600;
				background: var(--card);
			}
			.step.active {
				color: var(--text);
			}
			.step.active .dot {
				border-color: var(--brand);
				color: var(--brand);
				box-shadow: 0 0 0 4px var(--brand-soft);
			}
			.step.done .dot {
				background: var(--brand);
				border-color: var(--brand);
				color: var(--brand-ink);
			}
			.step.failed .dot {
				background: var(--bad);
				border-color: var(--bad);
				color: #fff;
			}
			.bar {
				flex: 1;
				height: 2px;
				background: var(--line);
				min-width: 12px;
				border-radius: 2px;
			}
			.bar.done {
				background: var(--brand);
			}
			@media (max-width: 520px) {
				.step span.label {
					display: none;
				}
				.step.active span.label {
					display: inline;
				}
			}

			/* Chat */
			.chat {
				display: flex;
				flex-direction: column;
				height: calc(100vh - 150px);
				min-height: 520px;
			}
			@media (max-width: 960px) {
				.chat {
					height: auto;
					min-height: 0;
				}
			}
			#transcript {
				flex: 1;
				overflow-y: auto;
				padding: 20px 18px;
				display: flex;
				flex-direction: column;
				gap: 14px;
			}
			@media (max-width: 960px) {
				#transcript {
					max-height: 62vh;
					min-height: 300px;
				}
			}
			.msg {
				display: flex;
				gap: 10px;
				max-width: 88%;
			}
			.msg.new,
			.outcome.new {
				animation: rise 0.2s ease-out;
			}
			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(4px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			.msg.customer {
				align-self: flex-end;
				flex-direction: row-reverse;
			}
			.avatar {
				flex: none;
				width: 32px;
				height: 32px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: var(--brand-soft);
				color: var(--brand);
			}
			.msg.customer .avatar {
				display: none;
			}
			.bubble {
				padding: 10px 14px;
				border-radius: 16px;
				background: var(--agent);
				border-top-left-radius: 4px;
			}
			.msg.customer .bubble {
				background: var(--brand);
				color: var(--brand-ink);
				border-radius: 16px;
				border-top-right-radius: 4px;
			}
			.who {
				display: block;
				font-size: 12px;
				color: var(--muted);
				margin-bottom: 2px;
				font-weight: 500;
			}
			.msg.customer .who {
				display: none;
			}
			.text {
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}
			.typing {
				display: none;
				align-items: center;
				gap: 10px;
			}
			.typing.show {
				display: flex;
			}
			.typing .bubble {
				display: flex;
				gap: 4px;
				padding: 14px;
			}
			.typing i {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--muted);
				animation: blink 1s infinite ease-in-out;
			}
			.typing i:nth-child(2) {
				animation-delay: 0.15s;
			}
			.typing i:nth-child(3) {
				animation-delay: 0.3s;
			}
			@keyframes blink {
				0%,
				80%,
				100% {
					opacity: 0.25;
				}
				40% {
					opacity: 1;
				}
			}

			/* Outcome cards */
			.outcome {
				align-self: stretch;
				border-radius: 14px;
				padding: 16px;
				border: 1px solid var(--line);
				display: grid;
				gap: 10px;
			}
			.outcome.good {
				background: var(--good-soft);
				border-color: color-mix(in srgb, var(--good) 30%, transparent);
			}
			.outcome.bad {
				background: var(--bad-soft);
				border-color: color-mix(in srgb, var(--bad) 30%, transparent);
			}
			.outcome h3 {
				margin: 0;
				font-size: 15px;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.outcome.good h3 {
				color: var(--good);
			}
			.outcome.bad h3 {
				color: var(--bad);
			}
			.outcome dl {
				margin: 0;
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 4px 16px;
				font-size: 14px;
			}
			.outcome dt {
				color: var(--muted);
			}
			.outcome dd {
				margin: 0;
				font-weight: 600;
			}
			.outcome p {
				margin: 0;
				font-size: 14px;
				color: var(--muted);
			}

			/* Composer */
			.chips {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				padding: 0 18px 10px;
			}
			.chips:empty {
				display: none;
			}
			.chip {
				border: 1px solid var(--line);
				background: var(--card);
				color: var(--text);
				border-radius: 999px;
				padding: 6px 12px;
				font-size: 13px;
			}
			.chip:hover {
				border-color: var(--brand);
				color: var(--brand);
			}
			.chips-label {
				width: 100%;
				font-size: 12px;
				color: var(--muted);
			}
			form {
				display: flex;
				gap: 8px;
				padding: 12px 14px 14px;
				border-top: 1px solid var(--line);
			}
			#message {
				flex: 1;
				min-width: 0;
				padding: 11px 14px;
				border: 1px solid var(--line);
				border-radius: 12px;
				font: inherit;
				background: var(--bg);
				color: var(--text);
			}
			#message:focus {
				outline: 2px solid var(--brand-soft);
				border-color: var(--brand);
			}
			#send {
				border: 0;
				border-radius: 12px;
				padding: 0 18px;
				background: var(--brand);
				color: var(--brand-ink);
				font-weight: 600;
			}
			#send:disabled,
			#message:disabled {
				opacity: 0.5;
				cursor: default;
			}
			#status {
				padding: 0 18px 8px;
				font-size: 13px;
				color: var(--muted);
			}
			#status:empty {
				display: none;
			}

			/* Side panel */
			.side {
				display: grid;
				gap: 16px;
			}
			.side h2 {
				margin: 0;
				font-size: 14px;
				font-weight: 600;
			}
			.side .head {
				padding: 14px 16px;
				border-bottom: 1px solid var(--line);
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
			}
			.side .head > span {
				font-size: 12px;
				color: var(--muted);
			}
			.demo {
				padding: 14px 16px;
				font-size: 14px;
				display: grid;
				gap: 8px;
			}
			.demo b {
				font-weight: 600;
			}
			.demo .row {
				display: flex;
				justify-content: space-between;
				gap: 8px;
			}
			.demo .row span:first-child {
				color: var(--muted);
			}
			.linkbtn {
				background: none;
				border: 0;
				padding: 0;
				color: var(--brand);
				font-weight: 500;
				font-size: 13px;
				justify-self: start;
				text-align: left;
			}
			.linkbtn:hover {
				text-decoration: underline;
			}

			#state {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px;
				padding: 14px 16px;
			}
			.kv {
				background: var(--bg);
				border-radius: 10px;
				padding: 8px 10px;
				min-width: 0;
			}
			.kv .k {
				font-size: 11px;
				color: var(--muted);
			}
			.kv .v {
				font-weight: 600;
				font-size: 14px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.v.yes {
				color: var(--good);
			}
			.v.no {
				color: var(--bad);
			}

			#trace {
				list-style: none;
				margin: 0;
				padding: 12px 16px 16px;
				max-height: 40vh;
				overflow-y: auto;
				display: grid;
				gap: 2px;
			}
			@media (max-width: 960px) {
				#trace {
					max-height: none;
				}
			}
			#trace .l {
				position: relative;
				padding: 4px 0 4px 18px;
				font-size: 12.5px;
				line-height: 1.45;
				overflow-wrap: anywhere;
				color: var(--muted);
			}
			#trace .l::before {
				content: "";
				position: absolute;
				left: 2px;
				top: 10px;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--line);
			}
			#trace .l::after {
				content: "";
				position: absolute;
				left: 5.5px;
				top: 20px;
				bottom: -6px;
				width: 1px;
				background: var(--line);
			}
			#trace .l:last-child::after {
				display: none;
			}
			#trace .handoff {
				color: var(--violet);
				font-weight: 600;
			}
			#trace .handoff::before {
				background: var(--violet);
			}
			#trace .tool {
				color: var(--blue);
			}
			#trace .tool::before {
				background: var(--blue);
			}
			#trace .ok {
				color: var(--good);
			}
			#trace .ok::before {
				background: var(--good);
			}
			#trace .fail {
				color: var(--bad);
			}
			#trace .fail::before {
				background: var(--bad);
			}
			#trace .state {
				color: var(--warn);
			}
			#trace .state::before {
				background: var(--warn);
			}
			#trace .wait {
				font-style: italic;
			}
			#trace .wait::before {
				background: var(--muted);
			}
			#trace .end {
				color: var(--text);
				font-weight: 600;
			}
			#trace .end::before {
				background: var(--text);
			}
			#trace .customer {
				color: var(--text);
			}
			.legend {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 12px;
				padding: 10px 16px 14px;
				border-top: 1px solid var(--line);
				font-size: 11px;
				color: var(--muted);
			}
			.legend i {
				display: inline-block;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				margin-right: 5px;
			}
			details.trace-card summary {
				list-style: none;
				cursor: pointer;
			}
			details.trace-card summary::-webkit-details-marker {
				display: none;
			}
			details.trace-card .chev {
				display: inline-block;
				vertical-align: -1px;
				margin-left: 4px;
				transition: transform 0.15s;
			}
			details.trace-card[open] .chev {
				transform: rotate(180deg);
			}
		</style>
	</head>
	<body>
		<header class="top">
			<div class="top-inner">
				<div class="brand">
					<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
						<rect width="28" height="28" rx="8" fill="var(--brand)" />
						<path
							d="M7 17c3-6 8-9 14-9-2 2-3 4-3 6 0 3-2 6-6 6-2 0-4-1-5-3z"
							fill="var(--brand-ink)"
						/>
						<circle cx="17.5" cy="11.5" r="1.2" fill="var(--brand)" />
					</svg>
					FinchPay <small>Refund help</small>
				</div>
				<div class="spacer"></div>
				<button id="new-chat" class="btn primary" type="button">New chat</button>
			</div>
		</header>

		<main class="wrap">
			<section class="card chat" aria-label="Chat">
				<div class="steps" id="steps">
					<div class="step" data-step="triage">
						<span class="dot">1</span><span class="label">Charge</span>
					</div>
					<div class="bar"></div>
					<div class="step" data-step="identity">
						<span class="dot">2</span><span class="label">Verify identity</span>
					</div>
					<div class="bar"></div>
					<div class="step" data-step="refund">
						<span class="dot">3</span><span class="label">Refund</span>
					</div>
				</div>
				<div id="transcript" aria-live="polite"></div>
				<div id="status" role="status"></div>
				<div class="chips" id="chips"></div>
				<form id="composer">
					<input
						id="message"
						type="text"
						autocomplete="off"
						placeholder="Type a message"
						aria-label="Message"
					/>
					<button id="send" type="submit">Send</button>
				</form>
			</section>

			<aside class="side">
				<div class="card">
					<div class="head">
						<h2>Demo data</h2>
						<span>all mocked, in memory</span>
					</div>
					<div class="demo">
						<div class="row"><span>Charge</span><b>CH-101 · $25.00</b></div>
						<div class="row"><span>Valid code</span><b>2468</b></div>
						<div class="row"><span>Wrong codes before lock</span><b>3</b></div>
						<button id="reset-demo" class="linkbtn" type="button">
							Reset demo data (clears refunds and locks)
						</button>
					</div>
				</div>

				<div class="card">
					<div class="head">
						<h2>Session state</h2>
						<span id="mode"></span>
					</div>
					<div id="state"></div>
				</div>

				<details class="card trace-card" open>
					<summary class="head">
						<h2>Under the hood</h2>
						<span
							>handoffs, tool calls, state
							<svg
								class="chev"
								width="12"
								height="12"
								viewBox="0 0 12 12"
								aria-hidden="true"
							>
								<path
									d="M2.5 4.5 6 8l3.5-3.5"
									fill="none"
									stroke="currentColor"
									stroke-width="1.6"
									stroke-linecap="round"
									stroke-linejoin="round"
								/></svg
						></span>
					</summary>
					<ol id="trace"></ol>
					<div class="legend">
						<span><i style="background: var(--violet)"></i>handoff</span>
						<span><i style="background: var(--blue)"></i>tool call</span>
						<span><i style="background: var(--good)"></i>success</span>
						<span><i style="background: var(--bad)"></i>failure or blocked</span>
						<span><i style="background: var(--warn)"></i>state change</span>
						<span><i style="background: var(--muted)"></i>waiting</span>
						<span><i style="background: var(--text)"></i>ended</span>
					</div>
				</details>
			</aside>
		</main>

		<script src="/app.js"></script>
	</body>
</html>
