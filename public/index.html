<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>FinchPay Refund Desk</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #f7f8fa;
				--surface: #ffffff;
				--text: #14202b;
				--muted: #6b7686;
				--line: #e6e9ee;
				--brand: #0f766e;
				--brand-ink: #ffffff;
				--brand-soft: #e7f4f2;
				--agent: #eef1f5;
				--good: #15803d;
				--good-soft: #eaf6ee;
				--bad: #b91c1c;
				--bad-soft: #fcecec;
				--warn: #b45309;
				--violet: #6d28d9;
				--blue: #1d4ed8;
				--drawer: 400px;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0b1117;
					--surface: #111921;
					--text: #e6edf3;
					--muted: #8b98a8;
					--line: #212d3a;
					--brand: #2dd4bf;
					--brand-ink: #062a26;
					--brand-soft: #0f2c2a;
					--agent: #19232e;
					--good: #4ade80;
					--good-soft: #10261a;
					--bad: #f87171;
					--bad-soft: #2a1414;
					--warn: #fbbf24;
					--violet: #a78bfa;
					--blue: #60a5fa;
				}
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				height: 100%;
			}

			body {
				font:
					15px/1.5 Inter,
					system-ui,
					-apple-system,
					sans-serif;
				background: var(--bg);
				color: var(--text);
				display: flex;
				flex-direction: column;
				height: 100dvh;
				overflow: hidden;
			}

			button {
				font: inherit;
				cursor: pointer;
			}

			/* Header: brand, steps, actions. One line. */
			.top {
				display: flex;
				align-items: center;
				gap: 16px;
				padding: 10px 20px;
				border-bottom: 1px solid var(--line);
				background: var(--surface);
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				font-weight: 700;
				font-size: 16px;
				white-space: nowrap;
			}

			.brand small {
				font-weight: 500;
				color: var(--muted);
				font-size: 14px;
			}

			.steps {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 6px;
				min-width: 0;
			}

			.step {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 13px;
				font-weight: 500;
				color: var(--muted);
				white-space: nowrap;
			}

			.step .dot {
				width: 20px;
				height: 20px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				border: 1.5px solid var(--line);
				font-size: 11px;
				font-weight: 600;
			}

			.step.active {
				color: var(--text);
			}

			.step.active .dot {
				border-color: var(--brand);
				color: var(--brand);
			}

			.step.done .dot {
				background: var(--brand);
				border-color: var(--brand);
				color: var(--brand-ink);
			}

			.step.failed .dot {
				background: var(--bad);
				border-color: var(--bad);
				color: #fff;
			}

			.bar {
				width: 28px;
				height: 1.5px;
				background: var(--line);
			}

			.bar.done {
				background: var(--brand);
			}

			.actions {
				display: flex;
				gap: 8px;
			}

			.btn {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				border: 1px solid var(--line);
				background: var(--surface);
				color: var(--text);
				padding: 7px 14px;
				border-radius: 999px;
				font-weight: 500;
				font-size: 14px;
				white-space: nowrap;
			}

			.btn:hover {
				border-color: var(--brand);
			}

			.btn.primary {
				background: var(--brand);
				color: var(--brand-ink);
				border-color: var(--brand);
			}

			.btn[aria-pressed="true"] {
				background: var(--brand-soft);
				border-color: var(--brand);
				color: var(--brand);
			}

			/* Language menu under the globe button. */
			.lang {
				position: relative;
			}

			#lang-menu {
				position: absolute;
				top: calc(100% + 6px);
				right: 0;
				z-index: 30;
				list-style: none;
				margin: 0;
				padding: 6px;
				min-width: 150px;
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 12px;
				box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
			}

			#lang-menu button {
				width: 100%;
				text-align: left;
				border: 0;
				background: none;
				color: var(--text);
				padding: 8px 10px;
				border-radius: 8px;
				font-size: 14px;
			}

			#lang-menu button:hover,
			#lang-menu button[aria-selected="true"] {
				background: var(--brand-soft);
				color: var(--brand);
			}

			.btn-short {
				display: none;
			}

			@media (max-width: 760px) {
				.top {
					flex-wrap: wrap;
					gap: 8px 12px;
					padding: 10px 16px;
				}

				.brand small {
					display: none;
				}

				.steps {
					order: 3;
					flex-basis: 100%;
				}

				.step .label {
					display: none;
				}

				.step.active .label {
					display: inline;
				}

				.actions {
					gap: 6px;
				}

				.btn .btn-label {
					display: none;
				}

				.btn .btn-short {
					display: inline;
				}

				.btn {
					padding: 7px 11px;
					font-size: 13px;
				}

				#lang-code {
					display: none;
				}

				.brand {
					margin-right: auto;
				}
			}

			/* Stage: the chat, plus the trace drawer when open. */
			.stage {
				flex: 1;
				min-height: 0;
				display: flex;
			}

			.chat {
				flex: 1;
				min-width: 0;
				display: flex;
				flex-direction: column;
			}

			#transcript {
				flex: 1;
				overflow-y: auto;
				padding: 28px 20px 12px;
			}

			.thread {
				max-width: 720px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				gap: 14px;
			}

			.msg {
				display: flex;
				gap: 10px;
				max-width: 85%;
			}

			.msg.new,
			.outcome.new {
				animation: rise 0.2s ease-out;
			}

			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(4px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}

			.msg.customer {
				align-self: flex-end;
				flex-direction: row-reverse;
			}

			.avatar {
				flex: none;
				width: 30px;
				height: 30px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: var(--brand-soft);
				color: var(--brand);
			}

			.msg.customer .avatar,
			.msg.customer .who {
				display: none;
			}

			.bubble {
				padding: 10px 14px;
				border-radius: 18px;
				border-top-left-radius: 6px;
				background: var(--agent);
			}

			.msg.customer .bubble {
				background: var(--brand);
				color: var(--brand-ink);
				border-radius: 18px;
				border-top-right-radius: 6px;
			}

			.who {
				display: block;
				font-size: 12px;
				color: var(--muted);
				margin-bottom: 2px;
				font-weight: 500;
			}

			.text {
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}

			.typing {
				display: none;
				align-items: center;
				gap: 10px;
			}

			.typing.show {
				display: flex;
			}

			.typing .bubble {
				display: flex;
				gap: 4px;
				padding: 14px;
			}

			.typing i {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--muted);
				animation: blink 1s infinite ease-in-out;
			}

			.typing i:nth-child(2) {
				animation-delay: 0.15s;
			}

			.typing i:nth-child(3) {
				animation-delay: 0.3s;
			}

			@keyframes blink {
				0%,
				80%,
				100% {
					opacity: 0.25;
				}
				40% {
					opacity: 1;
				}
			}

			/* The card at the end of a chat. */
			.outcome {
				margin-left: 40px;
				border-radius: 14px;
				padding: 14px 16px;
				display: grid;
				gap: 8px;
				max-width: 420px;
			}

			.outcome.good {
				background: var(--good-soft);
			}

			.outcome.bad {
				background: var(--bad-soft);
			}

			.outcome h3 {
				margin: 0;
				font-size: 15px;
			}

			.outcome.good h3 {
				color: var(--good);
			}

			.outcome.bad h3 {
				color: var(--bad);
			}

			.outcome dl {
				margin: 0;
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 2px 16px;
				font-size: 14px;
			}

			.outcome dt {
				color: var(--muted);
			}

			.outcome dd {
				margin: 0;
				font-weight: 600;
			}

			.outcome p {
				margin: 0;
				font-size: 13px;
				color: var(--muted);
			}

			/* Bottom: suggestions, message box, demo line. */
			.dock {
				padding: 8px 20px 14px;
			}

			.dock-inner {
				max-width: 720px;
				margin: 0 auto;
				display: grid;
				gap: 10px;
			}

			#status {
				font-size: 13px;
				color: var(--muted);
			}

			#status:empty,
			.chips:empty {
				display: none;
			}

			.chips {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
			}

			.chips-label {
				display: none;
			}

			.chip {
				border: 1px solid var(--line);
				background: var(--surface);
				color: var(--text);
				border-radius: 999px;
				padding: 6px 12px;
				font-size: 13px;
			}

			.chip:hover {
				border-color: var(--brand);
				color: var(--brand);
			}

			form {
				display: flex;
				gap: 8px;
				padding: 6px;
				border: 1px solid var(--line);
				border-radius: 16px;
				background: var(--surface);
			}

			form:focus-within {
				border-color: var(--brand);
			}

			#message {
				flex: 1;
				min-width: 0;
				padding: 8px 10px;
				border: 0;
				outline: 0;
				font: inherit;
				background: transparent;
				color: var(--text);
			}

			#send {
				border: 0;
				border-radius: 12px;
				padding: 0 18px;
				background: var(--brand);
				color: var(--brand-ink);
				font-weight: 600;
			}

			#send:disabled,
			#message:disabled {
				opacity: 0.45;
				cursor: default;
			}

			.demo-line {
				font-size: 12.5px;
				color: var(--muted);
				text-align: center;
			}

			.demo-line b {
				color: var(--text);
				font-weight: 600;
			}

			.linkbtn {
				background: none;
				border: 0;
				padding: 0;
				color: var(--brand);
				font-size: inherit;
				font-weight: 500;
			}

			.linkbtn:hover {
				text-decoration: underline;
			}

			/* Trace drawer. A column on wide screens, a sliding panel on small ones. */
			#drawer {
				width: var(--drawer);
				flex: none;
				border-left: 1px solid var(--line);
				background: var(--surface);
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			#drawer[hidden] {
				display: none;
			}

			@media (max-width: 1100px) {
				#drawer {
					position: fixed;
					top: 0;
					right: 0;
					bottom: 0;
					width: min(var(--drawer), 92vw);
					z-index: 20;
					box-shadow: -12px 0 32px rgba(15, 23, 42, 0.18);
				}
			}

			.drawer-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 14px 16px;
				border-bottom: 1px solid var(--line);
			}

			.drawer-head h2 {
				margin: 0;
				font-size: 15px;
			}

			.drawer-head span {
				font-size: 12px;
				color: var(--muted);
				display: block;
			}

			.icon-btn {
				border: 0;
				background: none;
				color: var(--muted);
				width: 32px;
				height: 32px;
				border-radius: 8px;
				font-size: 20px;
				line-height: 1;
			}

			.icon-btn:hover {
				background: var(--agent);
			}

			/* State: one wrapped line of facts, not a grid of boxes. */
			#state {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 16px;
				padding: 12px 16px;
				border-bottom: 1px solid var(--line);
				font-size: 13px;
			}

			.kv {
				display: flex;
				gap: 6px;
				align-items: baseline;
			}

			.kv .k {
				color: var(--muted);
			}

			.kv .v {
				font-weight: 600;
			}

			.v.yes {
				color: var(--good);
			}

			.v.no {
				color: var(--bad);
			}

			/* Trace: plain lines, grouped by customer message. */
			#trace {
				flex: 1;
				list-style: none;
				margin: 0;
				padding: 4px 16px 16px;
				overflow-y: auto;
				font-size: 13px;
				line-height: 1.5;
			}

			#trace .l {
				padding: 2px 0;
				overflow-wrap: anywhere;
				color: var(--muted);
			}

			#trace .customer {
				margin-top: 14px;
				padding-top: 12px;
				border-top: 1px solid var(--line);
				color: var(--text);
				font-weight: 600;
			}

			#trace .l:first-child {
				margin-top: 8px;
			}

			#trace .handoff {
				color: var(--violet);
				font-weight: 600;
			}

			#trace .tool {
				color: var(--blue);
			}

			#trace .ok {
				color: var(--good);
			}

			#trace .fail {
				color: var(--bad);
			}

			#trace .state {
				color: var(--warn);
			}

			#trace .wait {
				font-style: italic;
			}

			#trace .end {
				color: var(--text);
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<header class="top">
			<div class="brand">
				<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
					<rect width="28" height="28" rx="8" fill="var(--brand)" />
					<path
						d="M7 17c3-6 8-9 14-9-2 2-3 4-3 6 0 3-2 6-6 6-2 0-4-1-5-3z"
						fill="var(--brand-ink)"
					/>
					<circle cx="17.5" cy="11.5" r="1.2" fill="var(--brand)" />
				</svg>
				FinchPay <small data-i18n="subtitle">Refund help</small>
			</div>

			<nav class="steps" id="steps" aria-label="Progress">
				<div class="step" data-step="triage">
					<span class="dot">1</span
					><span class="label" data-i18n="stepCharge">Charge</span>
				</div>
				<div class="bar"></div>
				<div class="step" data-step="identity">
					<span class="dot">2</span
					><span class="label" data-i18n="stepVerify">Verify identity</span>
				</div>
				<div class="bar"></div>
				<div class="step" data-step="refund">
					<span class="dot">3</span
					><span class="label" data-i18n="stepRefund">Refund</span>
				</div>
			</nav>

			<div class="actions">
				<div class="lang">
					<button
						id="lang-button"
						class="btn"
						type="button"
						aria-haspopup="listbox"
						aria-expanded="false"
						aria-label="Language"
					>
						<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
							<circle
								cx="12"
								cy="12"
								r="9"
								fill="none"
								stroke="currentColor"
								stroke-width="1.6"
							/>
							<path
								d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"
								fill="none"
								stroke="currentColor"
								stroke-width="1.6"
							/>
						</svg>
						<span id="lang-code">EN</span>
					</button>
					<ul id="lang-menu" role="listbox" aria-label="Language" hidden>
						<li><button type="button" role="option" data-lang="en">English</button></li>
						<li><button type="button" role="option" data-lang="es">Español</button></li>
						<li>
							<button type="button" role="option" data-lang="fr">Français</button>
						</li>
					</ul>
				</div>
				<button
					id="trace-toggle"
					class="btn"
					type="button"
					aria-pressed="false"
					aria-controls="drawer"
					title="Show the agents' handoffs, tool calls and state"
				>
					<span class="btn-label" data-i18n="trace">Agent trace</span
					><span class="btn-short" data-i18n="traceShort">Trace</span>
				</button>
				<button id="new-chat" class="btn primary" type="button" data-i18n="newChat">
					New chat
				</button>
			</div>
		</header>

		<div class="stage">
			<main class="chat" aria-label="Chat">
				<div id="transcript" aria-live="polite"></div>

				<div class="dock">
					<div class="dock-inner">
						<div id="status" role="status"></div>
						<div class="chips" id="chips"></div>
						<form id="composer">
							<input
								id="message"
								type="text"
								autocomplete="off"
								placeholder="Type a message"
								aria-label="Message"
							/>
							<button id="send" type="submit" data-i18n="send">Send</button>
						</form>
						<div class="demo-line">
							<span data-i18n="demoCharge">Demo charge</span> <b>CH-101</b> · $25 ·
							<span data-i18n="demoCode">code</span> <b>2468</b> ·
							<button id="reset-demo" class="linkbtn" type="button" data-i18n="reset">
								Reset demo data
							</button>
						</div>
					</div>
				</div>
			</main>

			<aside id="drawer" aria-label="Agent trace" hidden>
				<div class="drawer-head">
					<div>
						<h2>Agent trace</h2>
						<span id="mode"></span>
					</div>
					<button id="trace-close" class="icon-btn" type="button" aria-label="Close">
						×
					</button>
				</div>
				<div id="state"></div>
				<ol id="trace"></ol>
			</aside>
		</div>

		<script src="/app.js"></script>
	</body>
</html>
