<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinchPay Refund Desk</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb; --accent: #1f6f5c; --agent: #eef2f6; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  section h2 { font-size: 13px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; }
  #transcript { flex: 1; overflow-y: auto; padding: 14px; height: 60vh; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
  .msg.customer { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.agent { align-self: flex-start; background: var(--agent); }
  .msg .who { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #state { padding: 10px 14px; font: 12px/1.6 ui-monospace, Menlo, monospace; border-bottom: 1px solid var(--line); }
  #trace { flex: 1; overflow-y: auto; margin: 0; padding: 10px 14px; height: 50vh; font: 12px/1.55 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .status { font-size: 13px; color: var(--muted); padding: 0 14px 10px; }
</style>
</head>
<body>
<header>
  <h1>FinchPay Refund Desk</h1>
  <button id="new-chat" class="secondary" type="button">New chat</button>
</header>
<main>
  <section>
    <h2>Chat</h2>
    <div id="transcript" aria-live="polite"></div>
    <div class="status" id="status"></div>
    <form id="composer">
      <input id="message" type="text" autocomplete="off" placeholder="Type a message" aria-label="Message">
      <button id="send" type="submit">Send</button>
    </form>
  </section>
  <section>
    <h2>Session state</h2>
    <div id="state"></div>
    <h2>Trace</h2>
    <pre id="trace"></pre>
  </section>
</main>
<script>
  const ROLE = { triage: "Triage", identity: "Identity", refund: "Refund" };
  let sessionId = null;
  const $ = (id) => document.getElementById(id);

  function render(data) {
    sessionId = data.sessionId;
    const t = $("transcript");
    t.replaceChildren(...data.messages.map((m) => {
      const div = document.createElement("div");
      div.className = "msg " + m.from;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = m.from === "customer" ? "You" : "FinchPay · " + ROLE[m.role];
      div.append(who, document.createTextNode(m.text));
      return div;
    }));
    t.scrollTop = t.scrollHeight;
    const s = data.state;
    $("state").textContent = Object.entries(s).map(([k, v]) => `${k}: ${JSON.stringify(v)}`).join("\n");
    $("state").style.whiteSpace = "pre";
    $("trace").textContent = data.trace.map((l) => l.replace(/^\S+\s+/, "")).join("\n");
    $("trace").scrollTop = $("trace").scrollHeight;
    const ended = s.status === "ended";
    $("message").disabled = ended;
    $("send").disabled = ended;
    $("status").textContent = ended ? "This conversation has ended. Press New chat to start again." : "";
    if (!ended) $("message").focus();
  }

  async function post(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    return data;
  }

  async function newChat() {
    $("message").value = "";
    render(await post("/api/session"));
  }

  $("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = $("message").value.trim();
    if (!message) return;
    $("message").value = "";
    $("send").disabled = true;
    try {
      render(await post("/api/chat", { sessionId, message }));
    } catch (err) {
      $("status").textContent = err.message;
      $("send").disabled = false;
    }
  });

  $("new-chat").addEventListener("click", newChat);
  newChat();
</script>
</body>
</html>
